# Actions tirado daqui: https://vite.dev/guide/static-deploy#github-pages
# Modificado pra incluir o emscripten e buildar WASM

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.10
      - name: build c++ files
        run: bash ./buildcpp.sh
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # Upload dist folder
          path: './dist'
      # workaround found here: https://www.jvt.me/posts/2026/11/25/github-pages-artifacts-bug/
      # Per https://github.com/actions/deploy-pages/issues/451, `deploy-pages` looks up the artifact once, and it may not be listed immediately after it is uploaded. Retry only the deploy, not the upload, as a second upload makes the lookup fail with multiple artifacts. Remove once https://github.com/actions/deploy-pages/pull/455 is released
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retrying deploy to GitHub Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 5

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retrying deploy to GitHub Pages
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retrying deploy to GitHub Pages
        if: steps.deployment_retry_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 3)
        id: deployment_retry_3
        if: steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1